<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2: Formulario</title>
</head>
<body>
    <h2>Formulario de Contacto Ignacio</h2>
    <form action="/submit-form" method="POST" style="max-width: 450px;">
        <fieldset>
            <legend>Información Personal</legend>

         <!--nombre - primer campo del formulario-->
        <h3>Ese nombre precioso que Dios te ha dado XD</h3>
        <label for="Tu Nombre">Tu Nombre:</label>
        <input type="text" id="nombre" name="nombre" placeholder="Dime tu Nombre!" required>
        <br>

        <!--edad - segundo campo del formulario-->
        <h3>Hace cuánto estás en el mundo?</h3>
        <label for="Tu Nombre">Tu Edad:</label>
        <input type="number" id="edad" name="Edad" placeholder="Dime tu Edad!" required>
        <br>

        <!--género - tercer campo del form-->
        <h3>Nene o nena? XD</h3>
        <label for="género">Te identificas como:</label>
        <select id="género" name="género" type="circle">
            <option value="femenino">Femenino</option>
            <option value="masculino">Masculino</option>
            <option value="no binario">No Binario</option>
        </select>
        <br>

        <!-- Botón Enviar -->
        <input type="submit" value="Enviar">
        <br><br>

        <!-- Área de texto multilínea -->
        <h3>Kudos para el dev :D</h3>
        <label for="comentario">Mensajes al developer</label><br>
        <textarea id="comentario" name="Mensaje al Dev" rows="6" cols="15"></textarea><br>
    </form>
</body>
</html>
